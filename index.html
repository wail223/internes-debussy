<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Chirurgie C - CPMC</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #059669;
            --secondary-hover: #047857;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        .header-logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 30px;
        }

        .buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-card {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .btn-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
        }

        .btn-card:active {
            transform: translateY(0);
        }

        /* Style Bouton 1 : Planning */
        .btn-planning {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }

        /* Style Bouton 2 : Calculateur RDV */
        .btn-rdv {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .icon {
            font-size: 32px;
            margin-right: 18px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
        }

        .btn-text {
            text-align: left;
        }

        .btn-title {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        .btn-desc {
            font-size: 13px;
            font-weight: normal;
            opacity: 0.9;
            display: block;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .btn-title {
                font-size: 16px;
            }
            .btn-desc {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-logo">🏥</div>
    <h1>Chirurgie « C » — CPMC</h1>
    <p class="subtitle">Outils d'organisation du service</p>

    <div class="buttons-grid">
        <!-- BOUTON 1 -->
        <a href="planning.html" class="btn-card btn-planning">
            <div class="icon">📅</div>
            <div class="btn-text">
                <span class="btn-title">Planning des Gardes</span>
                <span class="btn-desc">Générateur de rotations & présence des internes</span>
            </div>
        </a>

        <!-- BOUTON 2 -->
        <a href="rdv.html" class="btn-card btn-rdv">
            <div class="icon">⏰</div>
            <div class="btn-text">
                <span class="btn-title">Calculateur de RDV</span>
                <span class="btn-desc">Calcul rapide selon le jour de consultation</span>
            </div>
        </a>
    </div>

    <div class="footer">
        Service de Chirurgie C — Clinique Debussy
    </div>
</div>

</body>
</html>
