<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Chirurgie C - CPMC</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #059669;
            --secondary-hover: #047857;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        .header-logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 30px;
        }

        .buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-card {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .btn-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
        }

        .btn-card:active {
            transform: translateY(0);
        }

        /* Conteneur pour les 3 versions de planning sur une seule ligne */
        .planning-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-mini-planning {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 8px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-mini-planning:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
        }

        .mini-icon {
            font-size: 20px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px;
            border-radius: 8px;
            display: inline-flex;
        }

        .mini-title {
            font-size: 13px;
            display: block;
        }

        /* Style Bouton : V1 Planning */
        .btn-planning {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }

        /* Style Bouton : V2 Planning */
        .btn-planning2 {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9); /* Violet */
        }

        /* Style Bouton : V3 Planning */
        .btn-planning3 {
            background: linear-gradient(135deg, #f97316, #ea580c); /* Orange */
        }

        /* Style Bouton : Hospitalisation Manager (Bleu/Cyan ou Indigo élégant) */
        .btn-hospitalisation {
            background: linear-gradient(135deg, #0284c7, #0369a1);
        }

        /* Style Bouton : Calculateur RDV */
        .btn-rdv {
            background: linear-gradient(135deg, #10b981, #059669); /* Vert */
        }

        .icon {
            font-size: 32px;
            margin-right: 18px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
        }

        .btn-text {
            text-align: left;
        }

        .btn-title {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        .btn-desc {
            font-size: 13px;
            font-weight: normal;
            opacity: 0.9;
            display: block;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .btn-title {
                font-size: 16px;
            }
            .btn-desc {
                font-size: 12px;
            }
            .mini-title {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-logo">🏥</div>
    <h1>Chirurgie « C » — CPMC</h1>
    <p class="subtitle">Outils d'organisation du service</p>

    <div class="buttons-grid">
        <!-- 3 VERSIONS DE PLANNING SUR UNE SEULE LIGNE -->
        <div class="planning-row">
            <a href="planning.html" class="btn-mini-planning btn-planning" title="V1: Semaine On / Off">
                <span class="mini-icon">📅</span>
                <span class="mini-title">V1 Planning</span>
            </a>
            <a href="planning2.html" class="btn-mini-planning btn-planning2" title="V2: Échange de groupes">
                <span class="mini-icon">🔄</span>
                <span class="mini-title">V2 Groupes</span>
            </a>
            <a href="planning3.html" class="btn-mini-planning btn-planning3" title="V3: Mix Quotidien">
                <span class="mini-icon">🎭</span>
                <span class="mini-title">V3 Mix</span>
            </a>
        </div>

        <!-- BOUTON HOSPITALISATION MANAGER -->
        <a href="patients.html" class="btn-card btn-hospitalisation">
            <div class="icon">🛏️</div>
            <div class="btn-text">
                <span class="btn-title">Hospitalisation Manager</span>
                <span class="btn-desc">Gestion des lits, dossiers patients et étages</span>
            </div>
        </a>

        <!-- BOUTON CALCULATEUR RDV -->
        <a href="rdv.html" class="btn-card btn-rdv">
            <div class="icon">⏰</div>
            <div class="btn-text">
                <span class="btn-title">Calculateur des RDV</span>
                <span class="btn-desc">Calcul selon le jour de consultation</span>
            </div>
        </a>
    </div>

    <div class="footer">
        Service de Chirurgie C — Clinique Debussy
    </div>
</div>

</body>
</html>
