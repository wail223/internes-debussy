        .login-card h2 { color: #0284c7; margin-top: 0; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85em; font-weight: 600; color: #334155; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .btn-login { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1em; cursor: pointer; }
        .btn-login:hover { background: #0369a1; }
        #errorMsg { color: #dc2626; font-size: 0.85em; margin-top: 15px; display: none; background: #fef2f2; padding: 10px; border-radius: 8px; border: 1px solid #fecaca; text-align: left; word-break: break-word; }

</head>

    <div class="form-group">

    <button class="btn-login" onclick="login()">Se connecter</button>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        appId: "1:614550756274:web:d2b4a7aae5e939af9222ab"

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = async function() {
        let inputVal = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        if (!inputVal || !password) {
            errorMsg.innerHTML = "<b>Erreur :</b> Veuillez remplir tous les champs.";

            errorMsg.innerHTML = `<b>Code Erreur :</b> ${error.code}<br><small>${error.message}</small>`;

        }
    };
</script>
