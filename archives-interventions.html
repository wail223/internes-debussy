<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives Interventions - CPMC</title>
    <style>
        body { font-family: system-ui, sans-serif; background:#f1f5f9; padding:15px; margin:0; }
        .nav-links { display: flex; gap: 8px; margin-bottom: 15px; overflow-x:auto; }
        .nav-btn { background: #e2e8f0; color: #1e293b; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 0.85em; font-weight: 600; white-space:nowrap; }
        .nav-btn.active { background: #0284c7; color: white; }
        .container { background: white; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; }
        input[type="text"] { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
        th { background: #f8fafc; color: #0284c7; }
        .btn-save { background: #0284c7; color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; }

        /* STYLES DES INTERVENTIONS REPROGRAMMÉES ET ANNULÉES */
        tr.status-reprogrammed {
            background-color: #fefce8 !important;
            color: #854d0e;
        }
        tr.status-reprogrammed td {
            border-color: #fef08a;
        }
        
        tr.status-canceled {
            background-color: #fef2f2 !important;
            color: #991b1b;
        }
        tr.status-canceled td {
            border-color: #fecaca;
        }

        /* BADGES POUR LE STATUT */
        .badge-reprogrammed {
            background-color: #fef08a;
            color: #854d0e;
            border: 1px solid #eab308;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            display: inline-block;
        }

        .badge-canceled {
            background-color: #fecaca;
            color: #991b1b;
            border: 1px solid #ef4444;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="index.html" class="nav-btn">🏠 Accueil</a>
        <a href="patients.html" class="nav-btn">🛏️ Hospitalisation</a>
        <a href="interventions.html" class="nav-btn">📋 Programme Opératoire</a>
        <a href="archives.html" class="nav-btn">📦 Archive Patients</a>
        <a href="archives-interventions.html" class="nav-btn active">🗂️ Archive Interventions</a>
        <a href="fiche-de-mouvement.html" class="nav-btn">📄 Fiche Mouvement</a>
    </div>

    <div class="container">
        <h2>🗂 Historique des Interventions</h2>
        <input type="text" id="searchIntervention" placeholder="Rechercher par nom de patient, intervention, statut ou date (ex: 2026-10)..." onkeyup="renderInterventions()">
        
        <div style="overflow-x:auto;">
            <table id="intervTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Salle</th>
                        <th>Patient</th>
                        <th>Intervention</th>
                        <th>Opérateur</th>
                        <th>Statut</th>
                        <th>Remarque</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="intervTableBody">
                    <tr><td colspan="8" style="text-align:center;">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPXF0x6LT_1eG67ANYfwDCjgy_2Vghq9M",
            authDomain: "internes-debussy.firebaseapp.com",
            databaseURL: "https://internes-debussy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "internes-debussy"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let allInterventions = [];

        onValue(ref(db, 'programmes_operatoires/'), (snapshot) => {
            const data = snapshot.val() || {};
            allInterventions = [];
            
            // Transformer les données en un tableau plat pour faciliter la recherche
            Object.keys(data).forEach(dateStr => {
                const lignes = data[dateStr];
                if(Array.isArray(lignes)) {
                    lignes.forEach((ligne, index) => {
                        if(ligne) {
                            allInterventions.push({ date: dateStr, index: index, ...ligne });
                        }
                    });
                }
            });
            // Trier par date décroissante (plus récent en premier)
            allInterventions.sort((a, b) => new Date(b.date) - new Date(a.date));
            renderInterventions();
        });

        window.renderInterventions = function() {
            const tbody = document.getElementById('intervTableBody');
            const term = document.getElementById('searchIntervention').value.toLowerCase();
            let html = '';
            
            allInterventions.forEach(inv => {
                const searchString = `${inv.patientText || ''} ${inv.intervention || ''} ${inv.date || ''} ${inv.operateur || ''} ${inv.statut || ''}`.toLowerCase();
                
                if(searchString.includes(term)) {
                    const statutLower = (inv.statut || '').toLowerCase();
                    let rowClass = '';
                    let statusHtml = inv.statut || '-';

                    // Détection des statuts reprogrammés (jaune) et annulés (rouge)
                    if (statutLower.includes('reprogramm') || statutLower.includes('repro')) {
                        rowClass = 'status-reprogrammed';
                        statusHtml = `<span class="badge-reprogrammed">${inv.statut}</span>`;
                    } else if (statutLower.includes('annul')) {
                        rowClass = 'status-canceled';
                        statusHtml = `<span class="badge-canceled">${inv.statut}</span>`;
                    }

                    html += `
                    <tr class="${rowClass}">
                        <td><b>${inv.date}</b></td>
                        <td>${inv.salle || '-'}</td>
                        <td>${inv.patientText || '-'}</td>
                        <td>${inv.intervention || '-'}</td>
                        <td>${inv.operateur || '-'}</td>
                        <td>${statusHtml}</td>
                        <td>
                            <input type="text" id="rem_${inv.date}_${inv.index}" value="${inv.remarque || ''}" placeholder="Ajouter une remarque..." style="margin:0;">
                        </td>
                        <td>
                            <button class="btn-save" onclick="saveRemarque('${inv.date}', ${inv.index})">💾 Sauver</button>
                        </td>
                    </tr>`;
                }
            });
            tbody.innerHTML = html || '<tr><td colspan="8" style="text-align:center;">Aucune intervention trouvée.</td></tr>';
        };

        window.saveRemarque = function(date, index) {
            const remVal = document.getElementById(`rem_${date}_${index}`).value;
            update(ref(db, `programmes_operatoires/${date}/${index}`), { remarque: remVal }).then(() => {
                alert("Remarque enregistrée avec succès !");
            }).catch(err => {
                console.error("Erreur de sauvegarde de la remarque :", err);
                alert("Erreur lors de l'enregistrement.");
            });
        };
    </script>
</body>
</html>
