<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives Interventions - CPMC</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background:#f1f5f9; padding:15px; margin:0; }
        .nav-links { display: flex; gap: 8px; margin-bottom: 15px; overflow-x:auto; }
        .nav-btn { background: #e2e8f0; color: #1e293b; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 0.85em; font-weight: 600; white-space:nowrap; }
        .nav-btn.active { background: #0284c7; color: white; }
        
        table { width: 100%; border-collapse: collapse; background: white; font-size: 0.85em; margin-top:10px; }
        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
        th { background: #f8fafc; color: #0284c7; }
    </style>
</head>
<body>
    <h2>🗂️ Archives des Programmes Opératoires</h2>
    <div class="nav-links">
        <a href="patients.html" class="nav-btn">🛏️ Hospitalisation</a>
        <a href="interventions.html" class="nav-btn">📋 Programme Opératoire</a>
        <a href="archives.html" class="nav-btn">📦 Archive Patients</a>
        <a href="archives-interventions.html" class="nav-btn active">🗂️ Archive Interventions</a>
    </div>

    <label><b>Sélectionner une date passée :</b></label>
    <input type="date" id="archiveDate" onchange="fetchArchivedProgram()">

    <div id="archivedTableContainer" style="margin-top:15px;">Choisissez une date ci-dessus.</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPXF0x6LT_1eG67ANYfwDCjgy_2Vghq9M",
            authDomain: "internes-debussy.firebaseapp.com",
            databaseURL: "https://internes-debussy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "internes-debussy",
            storageBucket: "internes-debussy.firebasestorage.app",
            messagingSenderId: "614550756274",
            appId: "1:614550756274:web:d2b4a7aae5e939af9222ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.fetchArchivedProgram = function() {
            const date = document.getElementById('archiveDate').value;
            const container = document.getElementById('archivedTableContainer');
            
            onValue(ref(db, 'programmes_operatoires/' + date), (snapshot) => {
                const lines = snapshot.val();
                if(!lines || lines.length === 0) {
                    container.innerHTML = `<p>Aucun programme enregistré pour la date du ${date}.</p>`;
                    return;
                }

                container.innerHTML = `
                    <h3>Programme du ${date}</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Salle</th><th>Position</th><th>Patient</th><th>Âge</th><th>GRP</th>
                                <th>Diagnostic</th><th>Intervention</th><th>Opérateurs</th><th>INS/AMAR</th><th>Statut</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${lines.map(l => `
                                <tr>
                                    <td>${l.salle||'-'}</td><td>${l.position\vert{}\vert{}'-'}</td><td>${l.patientText||'-'}</td>
                                    <td>${l.age||'-'}</td><td>${l.grp\vert{}\vert{}'-'}</td><td>${l.diag||'-'}</td>
                                    <td>${l.intervention||'-'}</td><td>${l.operateur\vert{}\vert{}'-'}</td><td>${l.insAmar||'-'}</td>
                                    <td><b>${l.statut||'Maintenue'}</b></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }, { onlyOnce: true });
        };
    </script>
</body>
</html>
