<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur RDV - CPMC</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 400px; margin: auto; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .btn-home {
            display: block;
            text-align: center;
            background: #e2e8f0;
            color: #1e293b;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        .btn-home:hover { background: #cbd5e1; }

        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background: #007aff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        #resultat { margin-top: 15px; font-weight: bold; font-size: 18px; color: #333; text-align: center; }
        .rdv-date { color: #007aff; margin-top: 5px; text-transform: capitalize; }
        .rdv-count { color: #dc2626; font-size: 0.9em; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <a href="index.html" class="btn-home">🏠 Retour à l'accueil</a>

    <h3 style="margin-top: 0;">📅 Calculateur de RDV</h3>
    
    <label>Jour de consultation du médecin :</label>
    <select id="jourMedecin">
        <option value="0">Dimanche (Dr Merad, Dr. Zegane + Dr Benmoussa...)</option>
        <option value="1">Lundi (Pr. Chekman + Dr Benouaret, Dr. Gouaref...)</option>
        <option value="3">Mercredi (Pr. Azzouz, Pr. Jnied, Dr. Khelif...)</option>
        <option value="4">Jeudi (Pr. Djelali, Dr. Bouzid, Dr Akbal...)</option>
    </select>

    <label>Délai demandé (en jours) :</label>
    <input type="number" id="delai" placeholder="ex: 15" value="15" min="1">

    <button onclick="calculerRDV()">Calculer la date</button>

    <div id="resultat"></div>
</div>

<script>
    function calculerRDV() {
        let targetDay = parseInt(document.getElementById('jourMedecin').value);
        let delai = parseInt(document.getElementById('delai').value);
        
        if (isNaN(delai) || delai < 1) {
            document.getElementById('resultat').innerHTML = "<span style='color:#dc2626; font-size:0.85em;'>Veuillez entrer un délai valide.</span>";
            return;
        }

        let today = new Date();
        today.setHours(0, 0, 0, 0); // Réinitialiser l'heure pour un calcul exact des jours

        // Date exacte après le nombre de jours demandés
        let targetDate = new Date(today);
        targetDate.setDate(targetDate.getDate() + delai);

        // 1. Trouver l'option APRES ou EGAL à la date cible
        let dateAfter = new Date(targetDate);
        while (dateAfter.getDay() !== targetDay) {
            dateAfter.setDate(dateAfter.getDate() + 1);
        }

        // 2. Trouver l'option AVANT ou EGAL à la date cible
        let dateBefore = new Date(targetDate);
        while (dateBefore.getDay() !== targetDay) {
            dateBefore.setDate(dateBefore.getDate() - 1);
        }

        // Calcul du nombre total de jours depuis aujourd'hui
        let daysBefore = Math.round((dateBefore - today) / (1000 * 60 * 60 * 24));
        let daysAfter = Math.round((dateAfter - today) / (1000 * 60 * 60 * 24));

        let selectedDate;
        let finalDaysCount;

        // Vérifier si l'option "Avant" est bien dans le futur (> 0 jours depuis aujourd'hui)
        if (daysBefore > 0) {
            let gapBefore = Math.abs(daysBefore - delai);
            let gapAfter = Math.abs(daysAfter - delai);

            // Choisir la date dont l'écart avec le délai est le plus petit
            if (gapBefore <= gapAfter) {
                selectedDate = dateBefore;
                finalDaysCount = daysBefore;
            } else {
                selectedDate = dateAfter;
                finalDaysCount = daysAfter;
            }
        } else {
            // Si la date "Avant" est aujourd'hui ou dans le passé, prendre obligatoirement l'option "Après"
            selectedDate = dateAfter;
            finalDaysCount = daysAfter;
        }

        let options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        let dateFormatee = selectedDate.toLocaleDateString('fr-FR', options);

        document.getElementById('resultat').innerHTML = `
            <div>Prochain RDV :</div>
            <div class="rdv-date">${dateFormatee}</div>
            <div class="rdv-count">(rdv dans ${finalDaysCount} jour${finalDaysCount > 1 ? 's' : ''})</div>
        `;
    }
</script>

</body>
</html>
