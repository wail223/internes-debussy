<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Gardes & Roulement - CPMC</title>
    <!-- Bibliothèque pour lire les fichiers Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --border: #e5e7eb;
            --text-main: #1f2937;
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1350px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; text-align: center; margin-top: 0; color: #111827;}
        
        .controls, .bloc-manager { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; background: #f9fafb; padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .bloc-manager { background: #eff6ff; border-color: #bfdbfe; align-items: center; }
        .control-group { flex: 1; min-width: 160px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #4b5563; }
        input, select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 14px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 24px; }
        button:hover { background-color: #1d4ed8; }
        
        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1100px; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: top; }
        th { background-color: #f8fafc; font-weight: 600; text-align: center; position: sticky; top: 0; }
        
        .weekend-row { background-color: #fef9c3; }
        .mardi-row { background-color: #f3f4f6; }
        
        .inf-aicha { background-color: #e0f2fe; color: #0369a1; font-weight: bold; padding: 4px 8px; border-radius: 6px; }
        .inf-hakima { background-color: #fce7f3; color: #be185d; font-weight: bold; padding: 4px 8px; border-radius: 6px; }
        .badge-garde { background-color: #ef4444; color: white; padding: 4px 8px; border-radius: 6px; font-weight: bold; display: inline-block; }
        
        .plan-box { display: flex; flex-direction: column; gap: 6px; }
        .bloc-line { background-color: #fee2e2; color: #991b1b; padding: 5px; border-radius: 4px; font-weight: bold; }
        .repos-line { background-color: #dcfce7; color: #166534; padding: 5px; border-radius: 4px; font-weight: bold; }
        .service-line { background-color: #dbeafe; color: #1e40af; padding: 5px; border-radius: 4px; }
        .post-garde-text { text-decoration: underline; font-weight: bold; }
        .excel-bloc-badge { font-size: 0.8em; background: #10b981; color: white; padding: 2px 4px; border-radius: 4px; margin-left: 5px; }

        /* Highlight Styles */
        .hl-garde { background-color: #fee2e2 !important; border-left: 5px solid #ef4444 !important; }
        .hl-present { background-color: #dbeafe !important; border-left: 5px solid #3b82f6 !important; }
        .hl-repos { background-color: #dcfce7 !important; border-left: 5px solid #10b981 !important; }
        .highlight-text { font-weight: bold; font-size: 1.05em; text-decoration: underline; color: #000; }
        
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; max-width: 100%; padding: 0; }
            .controls, .bloc-manager, h1 { display: none; }
            table { border: 2px solid #000; }
            th, td { border: 1px solid #000 !important; color: #000; }
            .hl-garde, .hl-present, .hl-repos { border-left: none !important; background-color: transparent !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 Planning Intelligent : Gardes, Bloc & Roulement</h1>
    
    <!-- IMPORTATION EXCEL -->
    <div class="bloc-manager">
        <div class="control-group" style="flex: 2;">
            <label style="color: #1e40af;">📊 Importer le programme du Bloc (Fichier Excel .xlsx)</label>
            <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" style="background: white; margin-top: 5px;">
        </div>
        <div class="control-group" style="flex: 1; align-self: flex-end;">
            <div id="excelStatus" style="font-size: 13px; color: #10b981; font-weight: bold; padding: 10px; display: none;">✅ Fichier chargé !</div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Date de début :</label>
            <input type="date" id="startDate">
        </div>
        <div class="control-group">
            <label>Durée :</label>
            <select id="weeksCount">
                <option value="1">1 Semaine</option>
                <option value="2">2 Semaines</option>
                <option value="4" selected>1 Mois</option>
            </select>
        </div>
        <div class="control-group" style="background-color: #e5e7eb; padding: 10px; border-radius: 8px;">
            <label for="interneFiltre">👤 Mettre en évidence :</label>
            <select id="interneFiltre">
                <option value="-1">-- Personne --</option>
            </select>
        </div>
        <div class="control-group" style="display: flex; gap: 10px;">
            <button onclick="genererPlanning()">Générer</button>
            <button style="background-color: #10b981;" onclick="window.print()">🖨️ Imprimer</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">📅 Date</th>
                    <th style="width: 10%;">👩‍⚕️ Infirmière</th>
                    <th style="width: 10%;">🚨 Garde</th>
                    <th style="width: 23%;">🅰️ PLAN A (2 Prog.)</th>
                    <th style="width: 23%;">🅱️ PLAN B (1 Prog.)</th>
                    <th style="width: 23%;">©️ PLAN C (Aucun Bloc)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const internes = ['Waël', 'Noussaiba', 'Yassamine', 'Lylia', 'Ikram', 'Baya'];
    const baseDateUTC = Date.UTC(2026, 8, 29);
    const aichaAnchorDate = Date.UTC(2026, 9, 16); 
    const finPenaliteNoussaiba = Date.UTC(2026, 9, 23); 

    let blocOverrides = {}; // Stocke les données lues depuis Excel

    document.addEventListener("DOMContentLoaded", () => {
        let today = new Date();
        document.getElementById('startDate').value = today.toISOString().split('T')[0];
        
        let filtreSel = document.getElementById('interneFiltre');
        internes.forEach((name, i) => filtreSel.innerHTML += `<option value="${i}">${name}</option>`);

        document.getElementById('interneFiltre').addEventListener('change', genererPlanning);
        document.getElementById('weeksCount').addEventListener('change', genererPlanning);
        
        genererPlanning();
    });

    // LECTURE DU FICHIER EXCEL
    document.getElementById('excelUpload').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(evt) {
            try {
                let data = new Uint8Array(evt.target.result);
                let workbook = XLSX.read(data, {type: 'array'});
                let firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                // {raw: false} formate les dates comme elles apparaissent (ex: 25/10/2026)
                let json = XLSX.utils.sheet_to_json(firstSheet, {raw: false});

                blocOverrides = {}; // Réinitialise
                
                json.forEach(row => {
                    let dateVal = row['Date'] || row['date'] || row['DATE'];
                    let int1 = row['Interne 1'] || row['interne 1'] || row['Int1'];
                    let int2 = row['Interne 2'] || row['interne 2'] || row['Int2'];

                    if (dateVal && int1) {
                        // Nettoie et formate la date pour correspondre au format AAAA-MM-JJ
                        let isoDate = dateVal;
                        if (dateVal.includes('/')) {
                            let parts = dateVal.split('/');
                            if (parts.length === 3) {
                                let y = parts[2].length === 2 ? "20" + parts[2] : parts[2];
                                isoDate = `${y}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                            }
                        }

                        let prog = [int1.trim()];
                        if (int2 && int2.trim() !== int1.trim()) prog.push(int2.trim());
                        blocOverrides[isoDate] = prog;
                    }
                });

                document.getElementById('excelStatus').style.display = 'block';
                setTimeout(() => document.getElementById('excelStatus').style.display = 'none', 3000);
                
                genererPlanning(); // Met à jour le tableau immédiatement
            } catch (error) {
                alert("Erreur lors de la lecture du fichier Excel. Vérifiez les colonnes (Date, Interne 1, Interne 2).");
                console.error(error);
            }
        };
        reader.readAsArrayBuffer(file);
    });

    function genererPlanning() {
        const startDateInput = document.getElementById('startDate').value;
        if (!startDateInput) return;
        
        const daysToGenerate = parseInt(document.getElementById('weeksCount').value) * 7;
        const targetIdx = parseInt(document.getElementById('interneFiltre').value);
        const targetName = targetIdx !== -1 ? internes[targetIdx] : null;

        const startParts = startDateInput.split('-');
        let currentUTC = Date.UTC(startParts[0], startParts[1] - 1, startParts[2]);
        
        let tbody = document.getElementById('tableBody');
        tbody.innerHTML = ''; 
        const joursSemaine = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
        
        let blocCounts = { 'Waël': 0, 'Noussaiba': 0, 'Yassamine': 0, 'Lylia': 0, 'Ikram': 0, 'Baya': 0 };

        const hl = (name, extraClass = "") => {
            let classes = extraClass;
            if (targetName && name === targetName) classes += " highlight-text";
            if (classes.trim()) return `<span class="${classes.trim()}">${name}</span>`;
            return name;
        };

        for (let i = 0; i < daysToGenerate; i++) {
            let loopDate = new Date(currentUTC + i * 86400000);
            let dateKey = loopDate.toISOString().split('T')[0];
            let diffDays = Math.floor((loopDate.getTime() - baseDateUTC) / 86400000);
            
            let gardeIdx = ((diffDays % 6) + 6) % 6;
            let pgIdx = (gardeIdx - 1 + 6) % 6;
            
            let dayOfWeek = loopDate.getUTCDay();
            let isWeekend = (dayOfWeek === 5 || dayOfWeek === 6);
            let isTuesday = (dayOfWeek === 2);
            let isAicha = (((Math.floor(Math.floor((loopDate.getTime() - aichaAnchorDate)/86400000) / 2)) % 2) + 2) % 2 === 0;
            
            let nbReposExtra = 0;
            if (!isWeekend) nbReposExtra = isTuesday ? 1 : (isAicha ? 1 : 2); 
            
            let blocA = [], blocB = [], blocC = [];
            let isFromExcel = false;

            if (!isWeekend && !isTuesday) {
                if (blocOverrides[dateKey]) {
                    // Les données proviennent de l'Excel
                    blocA = blocOverrides[dateKey];
                    blocB = [blocA[0]]; 
                    isFromExcel = true;
                    blocA.forEach(n => { if(blocCounts[n] !== undefined) blocCounts[n]++; }); 
                } else {
                    // Auto-remplissage équitable si pas défini dans l'Excel
                    let dispoBloc = [...internes];
                    dispoBloc.sort((a, b) => {
                        let scoreA = blocCounts[a] * 10; 
                        let scoreB = blocCounts[b] * 10;
                        if (a === internes[gardeIdx] || a === internes[pgIdx]) scoreA += 5;
                        if (b === internes[gardeIdx] || b === internes[pgIdx]) scoreB += 5;
                        return scoreA - scoreB;
                    });

                    blocA = [dispoBloc[0], dispoBloc[1]];
                    blocB = [dispoBloc[0]];
                    blocA.forEach(n => blocCounts[n]++); 
                }
            }

            let pool = [];
            for(let j=0; j<6; j++) {
                if (j !== gardeIdx && j !== pgIdx && !blocA.includes(internes[j])) pool.push(j);
            }
            pool.sort((a, b) => {
                let getPrio = (idx) => {
                    if (idx === (gardeIdx - 2 + 6) % 6) return 4; 
                    if (idx === (gardeIdx - 3 + 6) % 6) return 3;
                    if (idx === (gardeIdx + 2) % 6) return 2;     
                    if (idx === (gardeIdx + 1) % 6) return 1;     
                    return 0;
                };
                let prioA = getPrio(a); let prioB = getPrio(b);
                if (loopDate.getTime() < finPenaliteNoussaiba) { if (a === 1) prioA = -1; if (b === 1) prioB = -1; }
                return prioB - prioA; 
            });
            let reposExtra = pool.slice(0, nbReposExtra);

            let rowClass = isWeekend ? "weekend-row" : (isTuesday ? "mardi-row" : "");
            if (targetIdx !== -1) {
                if (targetIdx === gardeIdx) rowClass += " hl-garde";
                else if (isWeekend || targetIdx === pgIdx || reposExtra.includes(targetIdx)) rowClass += " hl-repos";
                else rowClass += " hl-present";
            }

            let tr = document.createElement('tr');
            tr.className = rowClass.trim();

            const genererPlanHtml = (blocProgram) => {
                if (isWeekend) {
                    let rest = [];
                    for(let j=0; j<6; j++) if(j !== gardeIdx) rest.push(hl(internes[j]));
                    return `<div class="plan-box"><div class="repos-line">🏠 Maison: ${rest.join(', ')}</div><div class="service-line">🏥 Garde: ${hl(internes[gardeIdx], "post-garde-text")}</div></div>`;
                }
                
                let p = [];
                for(let j=0; j<6; j++) {
                    if (j !== gardeIdx && j !== pgIdx && !blocProgram.includes(internes[j])) p.push(j);
                }
                p.sort((a, b) => {
                    let getPrio = (idx) => {
                        if (idx === (gardeIdx - 2 + 6) % 6) return 4; 
                        if (idx === (gardeIdx - 3 + 6) % 6) return 3;
                        if (idx === (gardeIdx + 2) % 6) return 2;     
                        if (idx === (gardeIdx + 1) % 6) return 1;     
                        return 0;
                    };
                    return getPrio(b) - getPrio(a); 
                });

                let rExt = p.slice(0, nbReposExtra);
                let serv = p.slice(nbReposExtra);

                let liberesStr = `${hl(internes[pgIdx], "post-garde-text")} (PG)`;
                if (rExt.length > 0) liberesStr += ", " + rExt.map(idx => hl(internes[idx])).join(', ');

                let serviceStr = `${hl(internes[gardeIdx], "post-garde-text")} (G)`;
                if (serv.length > 0) serviceStr += ", " + serv.map(idx => hl(internes[idx])).join(', ');

                let blocFormatted = blocProgram.map(name => hl(name)).join(', ');
                let badgeHtml = (isFromExcel && blocProgram.length > 0) ? `<span class="excel-bloc-badge">Excel</span>` : '';

                return `
                    <div class="plan-box">
                        ${blocProgram.length > 0 ? `<div class="bloc-line">🔪 Bloc: ${blocFormatted}${badgeHtml}</div>` : ''}
                        <div class="repos-line">☕ Libérés: ${liberesStr}</div>
                        <div class="service-line">🏥 Service: ${serviceStr}</div>
                    </div>
                `;
            };

            let dateStr = `<strong>${joursSemaine[dayOfWeek]}</strong><br>${loopDate.getUTCDate().toString().padStart(2, '0')}/${(loopDate.getUTCMonth()+1).toString().padStart(2, '0')}`;
            let infirmiereStr = isAicha ? '<span class="inf-aicha">Aïcha</span>' : '<span class="inf-hakima">Hakima</span>';
            let gardeBadgeHtml = `<span class="badge-garde ${targetName && internes[gardeIdx] === targetName ? 'highlight-text' : ''}">${internes[gardeIdx]}</span>`;

            tr.innerHTML = `
                <td style="text-align:center;">${dateStr}</td>
                <td style="text-align:center;">${infirmiereStr}</td>
                <td style="text-align:center;">${gardeBadgeHtml}</td>
                <td>${genererPlanHtml(blocA)}</td>
                <td>${genererPlanHtml(blocB)}</td>
                <td>${genererPlanHtml(blocC)}</td>
            `;
            tbody.appendChild(tr);
        }
    }
</script>

</body>
</html>
